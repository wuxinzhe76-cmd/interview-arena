# 生产环境配置(Docker 部署用)
# 通过环境变量注入连接地址,默认用 host.docker.internal(宿主机)

spring:
  application:
    name: interview-arena-backend

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:host.docker.internal}:3306/interview_arena?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Arena@2026SecurePwd}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:Redis@2026Secure}

  rabbitmq:
    host: ${RABBITMQ_HOST:host.docker.internal}
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:Mq@2026Secure}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  devtools:
    restart:
      enabled: false

  # ==================== Elasticsearch ====================
  elasticsearch:
    uris: http://${ES_HOST:host.docker.internal}:9200
    connection-timeout: 5s
    socket-timeout: 30s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # ==================== Spring AI ====================
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:host.docker.internal}
          port: 19530
          username: root
          password: milvus
        database-name: default
        collection-name: interview_arena_qa
        embedding-dimension: 1024
        index-type: HNSW
        metric-type: COSINE
        initialize-schema: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      display-name: interview-arena API

management:
  endpoint:
    health:
      show-details: always
