version: '3.8'

services:
  # ===== 后端 =====
  backend:
    build: ./backend
    container_name: interview-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=host.docker.internal
      - REDIS_HOST=host.docker.internal
      - RABBITMQ_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - interview-net

  # ===== 前端 =====
  frontend:
    build: ./frontend
    container_name: interview-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - interview-net

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: interview-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - interview-net

networks:
  interview-net:
    driver: bridge
